# Alembic settings for this project's schema migrations.
#
# Normally you never call alembic directly: `python main.py` migrates on boot and
# `python main.py --migrate-only <action>` runs one action. db/migrate.py sets
# script_location, version_locations and sqlalchemy.url programmatically, and
# alembic/env.py resolves the database URL from config/config.yaml, so there is
# deliberately no sqlalchemy.url here: credentials never live in this file.

[alembic]
# Migration environment (env.py and the revision template), relative to this file.
script_location = %(here)s/alembic

# env.py imports project modules (src.*, db.*); this puts the project root
# (two levels up from db/migrate) on sys.path.
prepend_sys_path = ../..

# Revision files live in the top-level versions/ folder, outside the package.
version_locations = %(here)s/../../versions

# Split the two path lists above with os.pathsep.
path_separator = os


# Logging for command-line alembic runs; the server configures its own logging.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
