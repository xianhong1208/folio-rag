# folio-rag — Folio, a hierarchical RAG MCP server
# Install profiles:
#   uv sync                                   core only: every model is an HTTP endpoint
#                                             (rag.profile: cloud) — no torch, no transformers
#   uv sync --extra local --group <gpu>       + in-process models (docling layout/OCR, Whisper,
#                                             FireRedASR, CKIP, HuggingFace embeddings)
# GPU builds select PyTorch via PEP 735 dependency groups: `--group {rocm-r714|cuda|cpu}`.
# Only torch/torchvision/torchaudio differ per group; the [tool.uv] sections below map each one to its index.

[project]
name = "folio-rag"
version = "1.4.1"
description = "Folio MCP Server — hierarchical chunking + auto-merging retrieval, designed for gpt-oss-120b"
# 3.12 is the lowest Python with cp312 wheels for every PyTorch build (rocm/cuda/cpu).
requires-python = ">=3.12,<3.13"

dependencies = [
    # MCP / web framework
    "fastmcp>=4.1.5",
    "mcp[cli]>=1.24.0",
    "uvicorn==0.38.0",
    "fastapi>=0.162.0",
    # Logging / config / validation
    "loguru==0.7.3",
    "psutil==7.1.3",
    "pydantic==2.12.4",
    # Database
    "sqlalchemy==2.0.44",
    "psycopg2==2.9.11",
    "alembic==1.17.1",
    # LlamaIndex RAG stack
    "llama-index==0.14.24",
    "llama-index-core==0.14.24",
    "llama-index-vector-stores-postgres==0.9.0",
    "llama-index-embeddings-openai==0.6.0",
    "llama-index-embeddings-azure-openai==0.6.0",
    "llama-index-embeddings-openai-like==0.4.0",
    # Required by SimpleDirectoryReader's non-text fallback (not bundled in the 0.14.24 meta).
    "llama-index-readers-file==0.7.0",
    "pgvector==0.4.1",
    "openai==1.109.1",
    "tiktoken==0.12.0",
    "numpy==2.3.4",
    # Document parsing without models: docling-slim's format backends (Office, OpenDocument,
    # Markdown, HTML, LaTeX, e-mail, PDF text layer) are torch-free. The layout/OCR/ASR model
    # stack is the `local` extra. tree-sitter is needed to import docling-core's chunker
    # package (its code chunkers import it at package import).
    "docling-slim[format-office,format-opendocument,format-markdown,format-html,format-web,format-latex,format-email,format-pdf,convert-core]>=2.124.0",
    "tree-sitter>=0.25.0,<0.27.0",
    # Chunk token counting without transformers/torch: reads tokenizer.json, including the
    # bundled resources/tokenizers/ file (src/domain/rag/chunk_tokenizer.py).
    "tokenizers>=0.20.0",
    # OpenDocument (odt/ods/odp) parsing
    "odfdo>=3.22.0,<4.0.0",
    # Simplified -> Traditional conversion (no torch): repairs Simplified drift in LLM-written
    # contextual prefixes and detects the document's script (src/domain/rag/han_script.py) in
    # every profile, and converts FireRedASR output in the local one.
    "opencc>=1.1.9",
    # Page rendering for cloud PDF parsing (and page counts for progress)
    "pymupdf==1.26.7",
    "pillow>=13.0.0",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    # Test
    "pytest==9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.0",
    # Security pins. torch/torchvision/torchaudio come from [dependency-groups], not here.
    "nltk>=3.9.4",
    "authlib>=1.6.9",
    "aiohttp>=3.13.4",
    "urllib3>=2.6.3",
    "pypdf>=6.10.0",
    "python-multipart>=0.0.22",
    "jaraco-context>=6.1.0",
    "filelock>=3.20.3",
    "cryptography>=46.0.7",
    "pyjwt>=2.12.0",
    "marshmallow>=3.26.2",
    "requests>=2.33.0",
    "pygments>=2.20.0",
]

[project.optional-dependencies]
# In-process models (rag.profile: local / hybrid). `uv sync --extra local --group <gpu>`.
# Everything here pulls torch; profile: cloud never imports any of it
# (tests/test_cloud_profile_no_local_models.py).
local = [
    # Docling's layout / TableFormer / RapidOCR models + local Whisper (ASR extra)
    "docling[asr]>=2.124.0",
    # In-process embedding models (provider: huggingface)
    "llama-index-embeddings-huggingface==0.6.1",
    # FireRedASR — vendored official inference code (see [tool.uv.sources]; vendor/fireredasr_src)
    "fireredasr",
    # FireRedASR AED inference deps (arch-independent).
    "kaldiio>=2.18.0",
    "kaldi-native-fbank>=1.15",
    "sentencepiece>=0.2.0",
    # OCR runs via docling's transitive rapidocr (torch backend); no onnxruntime needed.
    # 5.x: 4.x carries advisories fixed only in 5.0-5.10 (torch.load in Trainer, malicious
    # config.json, save_pretrained path traversal, ...). Output checked equal to 4.57 for CKIP
    # segmentation, HuggingFace embeddings and docling layout/OCR.
    "transformers>=5.22.0,<6.0.0",
    # CKIP word segmentation for Chinese BM25/FTS (Academia Sinica). Segments in Python, then
    # Postgres tokenizes with `simple`; replaces the old pg_jieba/jiebacfg path.
    "ckip-transformers>=0.3.4",
]
# Alternative Chinese segmenter for keyword search (rag.retrieval.segmenter: jieba).
# No model and no torch, so it works under every profile. rag.retrieval.segmenter: bigram
# needs nothing at all.
jieba = ["jieba>=0.42.1"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", ".claude", "vendor", "frontend", "static"]

[tool.ruff.lint]
# Correctness only (pyflakes + the E4/E7/E9 errors), the same baseline as MCP Gate,
# Morphyard and Packwright. Style rules can be added one at a time with their fixes.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These set up sys.path, the working directory or allocator variables before the
# imports that depend on them.
"main.py" = ["E402"]
"db/migrate.py" = ["E402"]
"db/migrate/alembic/env.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

# Unit-test coverage. `omit` lists modules that need DB/vLLM/GPU/network and are covered by
# integration tests instead (tests/integration, opt-in with RAG_RUN_DB_ITESTS=1).
[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    # adapter layer (DB + llama_index)
    "src/adapter/file.py",
    "src/adapter/folder.py",
    "src/adapter/rag.py",
    "src/adapter/rag_context.py",
    "src/adapter/rag_indexing.py",
    "src/adapter/rag_query.py",
    "src/adapter/rag_maintenance.py",
    # API routers and Depends (FastAPI + DB)
    "src/api/router/health.py",
    "src/api/router/index.py",
    "src/api/router/media.py",
    "src/api/router/file_api.py",
    "src/api/router/folder_api.py",
    "src/api/router/rag_indexing.py",
    "src/api/router/rag_query.py",
    "src/api/dependencies/*",
    # RAG pipeline with heavy external deps (pgvector / vLLM / GPU / docling)
    "src/domain/rag/hierarchical_indexer.py",
    "src/domain/rag/document_loader.py",
    "src/domain/rag/leaf_splitter.py",
    "src/domain/rag/agentic_handlers.py",
    "src/domain/rag/index_service.py",
    "src/domain/rag/index_job_manager.py",
    "src/domain/rag/docling_loader.py",
    "src/domain/rag/query_engine.py",
    "src/domain/rag/vector_store_manager.py",
    "src/domain/rag/chunk_lookup.py",
    "src/domain/rag/reranker.py",
    "src/domain/rag/auto_merging.py",
    "src/domain/rag/embedding/*",
    # MCP tool registration / auth wiring (FastMCP + DB + httpx)
    "src/fastmcp_tools/*",
    "src/auth/dependencies.py",
    "src/auth/init_auth.py",
    # other wiring
    "src/log.py",
    "src/utils/db_bootstrap.py",
]

[tool.coverage.report]
# CI gate: `pytest --cov` exits non-zero below this. It was 95 but the suite measured
# ~88% (the gate was not enforced anywhere); it is set to the measured 91% (2026-11-02)
# so it now holds the line in CI — raise it as coverage grows, never lower it.
# A per-file 50% floor is enforced by scripts/check_coverage_floor.py (coverage has
# no built-in per-file threshold); .github/workflows/backend.yml runs both.
fail_under = 91
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]


# PyTorch install split (PEP 735). Groups are mutually exclusive — see [tool.uv] conflicts.
[dependency-groups]

# NVIDIA CUDA 13.0 wheels (driver >= 580). The same torch line as the cpu group: torch < 2.10
# carries GHSA-63cw-57p8-fm3p (torch.load RCE) and the < 2.13 lstm_cell / unpack_sequence /
# jit.script advisories. PyTorch publishes 2.14 for CUDA 13.0, not 12.x.
cuda = [
    "torch>=2.14.0,<2.15",
    "torchvision>=0.29.0,<0.30",
    # torchaudio's newest release is 2.11; it supports torch 2.14 (the cpu group pairs them too).
    "torchaudio>=2.11.0,<2.12",
    # triton is listed so its [tool.uv.sources] index pin applies (it is a torch transitive dep).
    "triton>=3.8.0,<3.9",
]

# Pure CPU (CI / no GPU). Keep torch >= 2.8 — earlier versions break docling ASR.
cpu = [
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "torchaudio>=2.8.0",
]

# AMD ROCm 7.14 multi-arch wheels: one torch[device-all] wheel covers all AMD archs
# (gfx1151 / gfx90a / gfx1201). [device-all] applies to torch/torchvision only, not
# torchaudio (matches AMD's official command; AMD ships no torchaudio newer than 2.11).
# torch 2.13: AMD's 2.11 / 2.12 builds require setuptools<82, which kept the whole lock (every
# group, CPU included) on setuptools 81 and its advisories. ROCm 7.13 was dropped for the same
# reason: its newest torch is 2.11.
rocm-r714 = [
    "torch[device-all]==2.13.0+rocm7.14.0",
    "torchvision[device-all]==0.28.0+rocm7.14.0",
    "torchaudio==2.11.0+rocm7.14.0",
]


[tool.uv]
# Lower concurrency so first-time bootstrap (~3.5GB of torch/cuda wheels) doesn't starve
# small downloads into the default 30s timeout. Consider UV_HTTP_TIMEOUT=300 in CI.
concurrent-downloads = 8

# setuptools is a torch dependency. Below 84.1 it carries PYSEC-2026-3447 and GHSA-xmj3-9gf7-h52w;
# this makes a lock that would fall back to an older one (an older AMD torch caps it at <82) fail
# instead of passing the dependency audit's back door.
#
# Mako (via alembic) below 1.4.2 carries GHSA-5639-2j2p-m4mx. soupsieve (via beautifulsoup4) below
# 4.0.0 carries CVE-2026-126190 and CVE-2026-126192; nothing that depends on it caps it below 4.
constraint-dependencies = ["setuptools>=84.1", "mako>=1.4.2", "soupsieve>=4.0.0"]

# Copy files into the venv instead of hard-linking them from the uv cache. NLTK >= 3.10.4 refuses
# to open a data file with more than one hard link (CWE-59), and llama-index ships its stopwords
# inside the package, so a hard-linked install breaks every NLTK lookup (uv hard-links whenever
# the cache and the venv share a filesystem, e.g. in CI and Docker).
link-mode = "copy"

# Deploy target is always Linux x86_64; without this, unsafe-best-match may pick a version
# that only ships aarch64/win wheels.
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# Needed because the AMD index only serves ROCm packages; a strict first-match resolver stalls
# on ordinary PyPI packages. The per-package [tool.uv.sources] pins isolate the few names that
# collide (e.g. triton, whose +rocm local version would otherwise win).
index-strategy = "unsafe-best-match"

# GPU/CPU groups are mutually exclusive (all install the same torch package from different
# indexes). This list is the only guard — add every new group (including new ROCm versions).
conflicts = [
    [
        { group = "rocm-r714" },
        { group = "cuda" },
        { group = "cpu" },
    ],
]


# Wheel index sources.
[[tool.uv.index]]
name = "pytorch-rocm-multiarch"
url = "https://repo.amd.com/rocm/whl-multi-arch/"
# Not explicit: torch[device-all]'s transitive ROCm runtime libs also live on this index.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


# Map torch/torchvision/torchaudio (and triton) to the right index per group.
[tool.uv.sources]
# Vendored FireRedASR (no PyPI release) installed as a local path dependency.
fireredasr = { path = "vendor/fireredasr_src" }
torch = [
    { index = "pytorch-rocm-multiarch", group = "rocm-r714" },
    { index = "pytorch-cu130",          group = "cuda"      },
    { index = "pytorch-cpu",            group = "cpu"       },
]
torchvision = [
    { index = "pytorch-rocm-multiarch", group = "rocm-r714" },
    { index = "pytorch-cu130",          group = "cuda"      },
    { index = "pytorch-cpu",            group = "cpu"       },
]
torchaudio = [
    { index = "pytorch-rocm-multiarch", group = "rocm-r714" },
    { index = "pytorch-cu130",          group = "cuda"      },
    { index = "pytorch-cpu",            group = "cpu"       },
]
# Pin triton to the CUDA index; otherwise the AMD index's +rocm local version outranks the
# bare 3.8.0 that CUDA needs, and torch.compile breaks on NVIDIA.
triton = [
    { index = "pytorch-cu130",        group = "cuda" },
]


# Install the project as a package so importlib.metadata can read the version (src/version.py).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "db"]
