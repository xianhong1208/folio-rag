# Retrieval — how documents become chunks (indexing) and how queries find them again.
rag:
  # Indexing background jobs (auto-indexing of uploaded files goes through here)
  indexing:
    # Max files indexed at once across all jobs (1-32; typically 4-8). Higher values starve
    # queries of DB connections, LLM capacity and threads. env FOLIO_INDEXING_CONCURRENCY overrides.
    max_concurrent_jobs: 4
    # Threads reserved for indexing's blocking work, apart from the query path's (1-64)
    executor_workers: 16
    # Per-file / per-job limits default to 10 days (IndexingConfig in src/config/model.py);
    # for temporary tweaks use FOLIO_PER_FILE_TIMEOUT_SECONDS / FOLIO_JOB_TIMEOUT_SECONDS.

  # Hierarchical chunking — leaves are split by Docling, parents are composed afterward
  chunking:
    # [parent_target_tokens, leaf_chunk_size]: larger parent → fuller context but higher return cost; smaller leaf → more precise but fragmented
    # ⚠️ changing leaf size requires a re-index to take effect
    hierarchy_sizes: [2048, 256]
    chunk_overlap: 50                           # overlap between adjacent leaves (keep it under 1/4 of the leaf)
    max_chunk_size: 2000

  # Contextual Retrieval — prepend an LLM-written context sentence to each leaf
  # (rag.contextual_llm in models.yaml, else rag.llm). Disabling greatly speeds up
  # indexing but degrades needle-in-a-haystack retrieval quality.
  contextual_retrieval:
    enabled: true
    apply_to: "leaf"                            # leaf / parent / all
    max_context_length: 150                     # max prefix length (chars): too long dilutes the chunk body's vector
    max_concurrent: 20                          # concurrent LLM requests per file: lower it if the backend returns 429
    max_concurrent_global: 16                   # cap across all files indexed at once (process-wide)
    # Max full-text fed to the LLM (chars): the document + template + chunk must fit the LLM context
    # (60000 chars ≈ 72K tokens, safe for gpt-oss @100K context)
    max_doc_chars: 60000
    # ⚠️ a reasoning model's thinking counts against the completion budget: too small and content comes back empty
    max_tokens: 2048
    reasoning_effort: "low"                     # gpt-oss supports low/medium/high; low is enough for prefix generation

  # Vector store — PGVector table configuration
  vector_store:
    type: "pgvector"
    table_prefix: "vector_store"

  # Hybrid retrieval + auto-merging + context expansion. These are defaults; each query can override them.
  retrieval:
    default_top_k: 10                           # number of chunks returned
    default_similarity_cutoff: 0.25             # vector similarity floor
    default_sparse_top_k: 12                    # BM25-side candidates
    rerank_pool: "per_list"                     # per_list = dense top N + BM25 top M (below); fused = top rerank_candidates of the fused list
    rerank_dense_candidates: 30                 # per_list: dense top N (at least 3 × top_k)
    rerank_sparse_candidates: 10                # per_list: BM25 top M
    rerank_candidates: 60                       # fused: the reranker sees max(3 × top_k, this) fused candidates
    default_hybrid_alpha: 0.75
    hybrid_search: true
    text_search_config: "simple"                # Postgres FTS config; Chinese is segmented in Python first
    # segmenter: ckip                           # ckip | jieba | bigram; unset = the profile's default
    ckip_device: "${CKIP_DEVICE:-cpu}"          # CKIP segmenter device: cpu / cuda / cuda:N / auto

    # Auto-merging — promote to the parent when enough of its leaves hit
    auto_merging:
      enabled: true
      merge_threshold: 0.4

    # Context expansion — neighbours of leaves that were not merged
    expand_context_default: true
    expand_context_neighbors: 1

    # MCP search response budget (estimated tokens); the lowest-ranked results are dropped to fit. 0 = no budget
    mcp_response_token_budget: 6000
    # MCP search relevance cutoff on the rerank score (0 = off). 0.9 is calibrated for
    # mxbai-rerank-v2 with its chat template; recalibrate for other models.
    min_relevance: 0.9

    # Max concurrent queries (shared by REST + MCP; excess queues)
    max_concurrent_queries: 8

    return_resource_files: false                # MCP search: also attach the top hit's original file
    resource_file_max_bytes: 1000000
