  evidence:
  - file: tw-gender-equality-in-employment-act.md
    spans:
    - 受僱者任職滿六個月後，於每一子女滿三歲前，得申請育嬰留職停薪，期間至該子女滿三歲止，但不得逾二年。同時撫育子女二人以上者，其育嬰留職停薪期間應合併計算，最長以最幼子女受撫育二年為限。
  - file: tw-rules-of-leave-taking-for-workers.md
    spans:
    - 勞工普通傷病假超過前條第一項規定之期限，經以事假或特別休假抵充後仍未痊癒者，得予留職停薪。但留職停薪期間以一年為限。
  expected_files:
  - tw-gender-equality-in-employment-act.md
  - tw-rules-of-leave-taking-for-workers.md
  source: 'tw-gender-equality-in-employment-act.md :: 第 16 條 + tw-rules-of-leave-taking-for-workers.md'
