  question: 若受僱者同時撫育兩名尚未滿三歲的子女，可根據《性別平等工作法》申請多長時間的育嬰留職停薪？而依《勞工請假規則》第五條，同類型的留職停薪最高只能多久？哪一條規定較嚴格？
