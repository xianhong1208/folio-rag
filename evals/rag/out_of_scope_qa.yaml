# Out-of-scope questions for the retrieval eval — hand-written, not generated.
#
# golden_qa.yaml's unanswerable items are near misses: on-topic for the corpus (the
# same laws, products and company) but asking for something it does not say. These are
# the other kind of "not found": questions about subjects the corpus does not cover at
# all. scripts/eval_retrieval.py loads them next to the golden set (type out_of_scope,
# no evidence) to measure the relevance cutoff (rag.retrieval.min_relevance) on both
# kinds; they never count towards Recall / MRR / nDCG. A few are deliberately
# adjacent to a document (high-speed rail fares in the travel policy, the Mid-Autumn
# festival bonus in the labour rules) without answering the question.
#
# Each item: id (h-oos-NN), type, lang, question, answer: null, evidence: [].
