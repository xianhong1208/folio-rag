name: Docker

# Builds the image and runs scripts/docker_smoke.sh on every pull request and every push to dev / main: the stack of
# docker-compose.yml (Folio, PostgreSQL/pgvector, MCP Gate with the mcp-gate profile) plus a stub model server, then
# health, migrations, authentication with a token from that MCP Gate, upload + index + search, and a restart and a
# recreate that keep the data. Never pushes (publish-image.yml does, on release tags).
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check docker-compose.yml
        run: POSTGRES_PASSWORD=check docker compose config --quiet
      - name: Build and smoke-test the image
        run: bash scripts/docker_smoke.sh
