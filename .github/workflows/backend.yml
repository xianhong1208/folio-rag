name: Backend CI

# Unit tests (with the coverage gates) and the PostgreSQL/pgvector integration group.
#
# Path-filtered to backend inputs: a frontend-only change already runs Console CI
# (frontend.yml) and would otherwise pay for a multi-GB torch/docling install that
# cannot be affected by it. This repository has no branch-protection ruleset, so a
# filtered-out run never leaves a required check pending; if one is added later,
# make these jobs required only together with a filter-aware gate.
# (The path list is repeated for push and pull_request: keep the two in step.)
on:
  push:
    branches: [dev, main]
    paths:
      - 'src/**'
      - 'db/**'
      - 'versions/**'
      - 'tests/**'
      - 'scripts/**'
      - 'evals/**'
      - 'vendor/**'
      - 'config/**'
      - 'main.py'
      - 'app.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'src/**'
      - 'db/**'
      - 'versions/**'
      - 'tests/**'
      - 'scripts/**'
      - 'evals/**'
      - 'vendor/**'
      - 'config/**'
      - 'main.py'
      - 'app.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: '0.9.24'
  PYTHON_VERSION: '3.12'
  # First-time downloads include ~1 GB of CPU torch wheels.
  UV_HTTP_TIMEOUT: '300'
  HF_HOME: ${{ github.workspace }}/.hf-cache
  # uv hardlinks packages out of its cache by default. nltk's path guard refuses to open a
  # multiply-linked file (st_nlink > 1), which breaks llama-index's bundled stopwords in a
  # hardlinked .venv. Copying costs a little install time and gives ordinary files.
  UV_LINK_MODE: copy

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      # Pinned so a ruff release cannot turn the build red on its own; rules live in
      # pyproject.toml [tool.ruff].
      - run: uvx ruff@0.17.4 check .

  unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: hf-${{ runner.os }}-
      - name: Install ffmpeg
        # Audio transcription shells out to ffmpeg (resample, silence detection, trim);
        # the tests that exercise it run the real binary.
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: Install (local model stack + jieba, CPU torch group, locked)
        # The unit suite covers the in-process providers too, so it needs the `local`
        # extra (and `jieba` for the optional segmenter); torch comes from the cpu group.
        run: uv sync --frozen --extra local --extra jieba --group cpu
      - name: Unit tests (fails below [tool.coverage.report] fail_under)
        # Integration tests skip themselves unless RAG_RUN_DB_ITESTS=1.
        run: uv run --no-sync pytest --cov --cov-report=term --cov-report=json:reports/coverage.json
      - name: Per-file coverage floor
        run: uv run --no-sync python scripts/check_coverage_floor.py reports/coverage.json

  integration:
    name: Integration tests (PostgreSQL + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # config/config.yaml reads ${DATABASE_URL}; the harness creates and drops its
      # own throwaway database ($RAG_ITEST_DB) on this server.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      RAG_RUN_DB_ITESTS: '1'
      RAG_ITEST_DB: agentic_rag_itest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: hf-${{ runner.os }}-
      - name: Install (local model stack + jieba, CPU torch group, locked)
        run: uv sync --frozen --extra local --extra jieba --group cpu
      - name: Integration tests
        run: uv run --no-sync pytest tests/integration -p no:cacheprovider

  core:
    # What `uv sync` without extras installs (rag.profile: cloud): no torch, no
    # transformers, no CKIP. The unit suite runs on it (tests that need the local stack
    # skip themselves), including tests/test_cloud_profile_no_local_models.py, which
    # proves the cloud profile boots, indexes (Office, cloud vision PDF/image, cloud STT)
    # and answers on that install, imports nothing from the local stack, and segments
    # Chinese for BM25 with the bigram default. Cheap: no torch download. No coverage
    # gate here — the `unit` job owns it.
    name: Core install (cloud profile)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install ffmpeg
        # Audio transcription shells out to ffmpeg (resample, silence detection, trim);
        # the tests that exercise it run the real binary.
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: Install (core only, locked)
        run: uv sync --frozen
      - name: Unit tests on the core install
        run: uv run --no-sync pytest -p no:cacheprovider
